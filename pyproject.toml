[project]
name = "keitaro-wrap"
version = "0.1.0"
description = "Keitaro campaign creator + offer editor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.17.5",
  "pyrefly>=1.4.1",
  "interrogate>=1.7.0",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "interrogate>=1.7.0",
    "pyrefly>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = ["**/*.py"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 64
show_missing = true
skip_covered = false

[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
fail-under = 100
verbose = 1
